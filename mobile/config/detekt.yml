# Overrides on top of detekt's default rule set (buildUponDefaultConfig).
naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # SCREAMING_CASE constants, and design tokens as PascalCase vals (as in
    # Compose's own Material tokens).
    constantPattern: '[A-Z][_A-Za-z0-9]*'
style:
  MaxLineLength:
    # Same limit as ktlint (.editorconfig).
    maxLineLength: 140
  MagicNumber:
    # Test source sets of every target (commonTest, jvmTest, androidHostTest).
    excludes: ['**/*Test/**', '**/test/**']
    # Design tokens (dp, sp, colour channels) are the numbers themselves.
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
    # Bands such as RPE 1..3 read better as ranges than as named constants.
    ignoreRanges: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
complexity:
  TooManyFunctions:
    # Kotlin files of top-level functions (unit conversion, date helpers) are
    # the equivalent of a TypeScript module; 11 is a class-sized limit.
    thresholdInFiles: 40
    # A screen's view model has one function per user action.
    thresholdInClasses: 20
  LongParameterList:
    # Composables take their state and callbacks as parameters; test builders
    # take one per field they vary.
    ignoreAnnotated: ['Composable']
    excludes: ['**/*Test/**', '**/test/**']
  CyclomaticComplexMethod:
    # A screen branches on its state to pick what to draw; the logic it
    # renders lives in view models and plain functions, which stay checked.
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
