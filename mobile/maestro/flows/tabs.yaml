# Every tab opens on the signed-in app, and the coach panel opens over them.
appId: com.fitai.coach
name: tabs
tags:
  - smoke
---
- launchApp
- extendedWaitUntil:
    visible: "training"
    timeout: 30000
- tapOn: "Log Workout"
- assertVisible: "Continue to exercises"
- tapOn: "Nutrition"
- assertVisible: "nutrition"
# Settings before Analytics: its own "Training" tab would answer the tap that leaves for the Training screen.
- tapOn: "Settings"
- assertVisible: "settings"
- tapOn: "Analytics"
- assertVisible: "analytics"
- tapOn: "Training"
- assertVisible: "training"
- tapOn: "open AI Coach"
- waitForAnimationToEnd
- back
- assertVisible: "training"
