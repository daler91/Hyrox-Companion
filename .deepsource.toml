version = 1

# Files DeepSource should not analyze at all. Mirrors the global `ignores` in
# eslint.config.js and the exclusions in sonar-project.properties, so the three
# analyzers agree on what counts as hand-written source.
exclude_patterns = [
  "dist/**",
  "build/**",
  "node_modules/**",
  "coverage/**",
  # Drizzle-generated SQL. Applied migrations must not be edited to appease a
  # linter, and the SQL analyzers flag them with Oracle-specific rules that
  # don't apply to PostgreSQL (see the note in .sonarcloud.properties).
  "migrations/**",
  "**/*.sql",
  "attached_assets/**",
  "client/public/**",
  # Emitted by script/race-benchmarks — not hand-edited.
  "**/*.generated.ts",
  "script/race-benchmarks/output/**",
  # Build/tooling config. eslint.config.js ignores `*.config.js` and
  # `*.config.ts` globally because they sit outside tsconfig.eslint.json and so
  # can't be type-checked; DeepSource was still analysing vite.config.ts,
  # vitest*.config.ts, drizzle.config.ts, tailwind.config.ts and cypress.config.ts
  # under production-strength rules. Listed twice because these live at the repo
  # root, and a bare `*.config.ts` is not guaranteed to match nested copies.
  "*.config.js",
  "*.config.ts",
  "**/*.config.js",
  "**/*.config.ts",
]

# Test code. Declaring these lets DeepSource drop the checks that only make
# sense for production code — most visibly JS-0323 (`no-explicit-any`), which
# this repo deliberately scopes the same way: eslint.config.js sets
# "@typescript-eslint/no-explicit-any": "error" for all of **/*.{ts,tsx}, then
# switches it (and the no-unsafe-* family) off for exactly these paths. Test
# doubles have to reach past the type system to stub browser globals
# (`globalThis as any`) and to narrow mocked framework return values, so the
# carve-out is intentional rather than debt — see TECHNICAL_DEBT.md item 16.
#
# Production code carries no `any` and is expected to stay that way: ESLint
# fails the build on a new one, so nothing here weakens that guarantee.
test_patterns = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/__tests__/**",
  "**/tests/**",
  "test/**",
  "cypress/**",
  "**/testUtils.ts",
  "**/helpers.ts",
  "vitest.setup.ts",
  "vitest.integration.setup.ts",
  # Test-support code that carries no `.test.` in its name and so was being
  # analysed as production. `test/**` above is anchored at the repo root and
  # does not reach client/src/test/, which holds the React factories, harnesses
  # and module mocks (offlineMutationHarness, radixPointerMocks, …).
  "client/src/test/**",
  "**/__mocks__/**",
  # Shared fixture modules, named per-subject rather than by directory.
  "**/testFixtures.ts",
  "server/services/coachService.testFixtures.ts",
  "server/services/coachService.dbMockState.ts",
  "server/services/nutrition/foodTestFixture.ts",
  "shared/nutritionTestFixtures.ts",
  # Offline harness for the coach-influence experiment, not shipped code.
  "script/coach-influence/harness.ts",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  environment = ["browser", "nodejs"]
  dialect = "typescript"
  module_system = "esm"

  # JS-R1005 ("cyclomatic complexity higher than threshold") was the single
  # biggest source of failed DeepSource runs, and every instance was a function
  # nobody would call complex. It fires per risk band, not per number:
  # unset, this repo's runs were flagging at the "medium" band — complexity 6
  # and 7 — which is a two-branch function with a couple of guard clauses.
  #
  # PR #2029 failed the JavaScript check on exactly one issue: complexity 6 in
  # `processTodaySessionBrief`, on a line whose diff had *removed* a branch.
  # PR #2026 carried seven more on its first page of review comments alone,
  # at 7, 7, 7, 7, 12, 14 and 14.
  #
  # "high" is DeepSource's own documented default for the JavaScript analyzer
  # and raises at >25. That is still stricter than this repo's own gate:
  # eslint.config.js sets `complexity: ["warn", 45]` on the surfaces it guards
  # (Timeline, Settings, workout-detail) and no global complexity rule at all,
  # so nothing between 6 and 25 was ever meant to block a merge. Setting it
  # here also pins the value in the repo instead of leaving it to the dashboard.
  # Dial to "very-high" if >25 still proves noisy.
  cyclomatic_complexity_threshold = "high"
