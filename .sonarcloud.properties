# SonarQube Cloud Automatic Analysis reads THIS file, not
# sonar-project.properties (which only applies to CI-based scans — see the
# commented-out scan job in .github/workflows/build.yml). Mirror the
# exclusions here so Automatic Analysis skips Drizzle SQL migrations too:
# the PL/SQL analyzer flags them with Oracle-specific rules ("use VARCHAR2",
# "eliminate EXISTS") that don't apply to PostgreSQL, and applied migrations
# must not be edited to appease a linter anyway.
sonar.exclusions=migrations/**,**/*.sql,**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/test/support/**
# Without this, Automatic Analysis never classifies *any* file as test code
# (sonar-project.properties' sonar.tests/test.inclusions only apply to the
# CI-based scan job, which is disabled), so every *.test.ts/.tsx file in the
# repo — new or pre-existing — is scanned as production source and held to
# the "Duplicated Lines on New Code" gate meant for application code. Test
# files naturally share similar arrange/mock blocks across suites; that is
# not the kind of duplication the gate exists to catch.
#
# The __tests__/ and test/support/ patterns catch shared test-only helpers
# that don't end in .test.ts themselves (integrationDb.ts, queryBuilderMock.ts,
# the client/src/test/support/* mock/harness files) — without them, a helper
# living in a test directory is still scanned as production source.
sonar.tests=client/src,server,shared
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/test/support/**
