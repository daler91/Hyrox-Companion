[build]
builder = "nixpacks"
# CYPRESS_INSTALL_BINARY=0: the production image never runs Cypress, so skip
# the ~250MB binary download its postinstall would otherwise perform (and the
# repo postinstall that patches it, which exits early without the binary).
buildCommand = "CYPRESS_INSTALL_BINARY=0 pnpm install --frozen-lockfile && pnpm run build"

[deploy]
startCommand = "node script/start.js"
# Liveness probe (W7): dependency-free, so a transient DB blip can't fail the
# healthcheck and churn restarts under restartPolicyType=on_failure. The
# readiness probe (/api/v1/health, which 503s on DB/vector-DB failure) is for
# load-balancer traffic gating, not restarts.
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
