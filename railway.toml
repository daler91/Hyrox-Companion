[build]
builder = "nixpacks"
# --ignore-scripts (S4, CODEBASE_ANALYSIS_2026-10-03): Railway puts every
# service variable (DATABASE_URL, ENCRYPTION_KEY, provider keys) in the build
# environment, so a compromised dependency's postinstall would run here with
# all of them. Every CI workflow already installs this way, and cypress.yml
# installs, builds and boots the server with the same flag. No package needs
# its script: esbuild and @sentry/cli resolve their platform binaries from
# optional dependencies, and bufferutil loads its bundled prebuild (or its JS
# fallback). What the flag skips is unwanted here anyway: Cypress's ~250MB
# binary download and the repo postinstall that patches it, Scarf's install
# telemetry and protobufjs's CLI check. nixpacks.toml's install phase carries
# the same flag.
buildCommand = "pnpm install --frozen-lockfile --ignore-scripts && pnpm run build"

[deploy]
startCommand = "node script/start.js"
# Readiness, not liveness (D2, CODEBASE_ANALYSIS_2026-10-03). Railway polls this
# path only while a deploy rolls out: the first 2xx makes the new deployment
# active and retires the old one, and it is never polled after go-live, so a
# runtime DB blip cannot churn restarts through it (the W7 concern).
# /api/v1/health answers 503 until boot has reached the DB and mounted every
# route, and for good if boot fails, so a broken release fails its deploy while
# the previous one keeps serving. The liveness route answered 200 as soon as
# the port bound.
healthcheckPath = "/api/v1/health"
# A healthy boot is ready in seconds; the slowest legitimate path is the DB
# connect retry in server/maintenance.ts (~54 s at worst).
healthcheckTimeout = 120
# SIGTERM-to-SIGKILL grace for the outgoing deployment (D3). Railway's default
# is 0 s, which killed the old instance before registerShutdownHandlers
# (server/bootstrap/lifecycle.ts) could drain SSE, stop pg-boss or flush
# Sentry. 65 s covers its 60 s SHUTDOWN_TIMEOUT_MS, so the app's own force-exit
# fires before Railway's SIGKILL.
drainingSeconds = 65
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
