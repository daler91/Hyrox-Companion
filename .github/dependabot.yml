# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      # typescript must stay on 6.0.x until typescript-eslint supports the
      # TS 7 native compiler's API (expected after TypeScript 7.1): the
      # package named "typescript" is what typescript-eslint and Cypress
      # resolve for the JS compiler API, which typescript@7 no longer ships.
      # TS 7 itself is installed separately as the "typescript7" npm alias
      # (aliases are not updated by Dependabot - bump it manually).
      # Minor is blocked too because typescript-eslint's peer range caps at
      # <6.1.0. See TECHNICAL_DEBT.md for the conditions to remove this.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
