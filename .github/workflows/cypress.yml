name: Cypress Tests

# Runs on pushes AND pull requests so a fork/PR branch gets the same end-to-end
# gate as a push to a branch in this repository. Secrets are unavailable on
# fork PRs, so every secret-backed value below has an inert fallback the suite
# can run against (the server boots without Gemini/Strava/Sentry configured).
on:
  push:
  pull_request:

# Permissions are declared per job (below) rather than for the whole workflow,
# so each job holds exactly the token scope it uses.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

jobs:
  # The record/parallel pair only works with a Cypress Cloud record key. Decide
  # the matrix once here: with the key, two containers split the specs; without
  # it, a single container runs everything (two unrecorded containers would
  # each run the full suite twice over, and `parallel: true` without a key
  # fails the run outright).
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      containers: ${{ steps.plan.outputs.containers }}
      record: ${{ steps.plan.outputs.record }}
    steps:
      - id: plan
        env:
          HAS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY != '' }}
        run: |
          if [ "$HAS_RECORD_KEY" = "true" ]; then
            echo 'containers=[1, 2]' >> "$GITHUB_OUTPUT"
            echo 'record=true' >> "$GITHUB_OUTPUT"
          else
            echo 'containers=[1]' >> "$GITHUB_OUTPUT"
            echo 'record=false' >> "$GITHUB_OUTPUT"
          fi

  cypress-run:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        containers: ${{ fromJSON(needs.plan.outputs.containers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Cache Cypress binary
        id: cypress-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          # Keyed on the lockfile: the Cypress version (and so the binary) can
          # only change with it. One step, one key — a second cache step with a
          # different key used to make the restore below never hit.
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        # --ignore-scripts keeps dependency lifecycle scripts from executing in
        # CI. That also skips this repo's own postinstall
        # (script/patch-cypress-deps.js), which needs the Cypress binary on disk
        # to do anything — so it runs explicitly after `cypress install` below.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Cypress binary
        # Only on a cache miss. node_modules/.bin/cypress is the binary the
        # lockfile pinned; `npx` would fall back to fetching an unpinned one
        # from the registry, and `pnpm exec cypress install` reads to SonarCloud
        # like a package installation missing --ignore-scripts — a flag
        # `cypress install` (a binary download that runs no lifecycle scripts)
        # doesn't take.
        if: steps.cypress-cache.outputs.cache-hit != 'true'
        run: node_modules/.bin/cypress install

      - name: Patch Cypress bundled dependencies
        # Idempotent, and cheap when the cached binary was already patched.
        run: node script/patch-cypress-deps.js
        env:
          CI: "true"

      - name: Build application
        run: pnpm run build

      - name: Verify client bundle invariants
        # script/build.ts runs these same checks but only WARNS, so a regression
        # would scroll past in the build log. This step is the one that can
        # actually fail the run: recharts must stay off the eager critical path
        # (~390KB on every first paint if it returns) and the drizzle graph must
        # not reach the browser.
        run: pnpm check:bundle

      - name: Enable pgvector extension
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Push database schema
        run: pnpm exec drizzle-kit push

      - name: Run Integration Tests
        # Container 1 only: these are DB-level suites, not Cypress specs, so a
        # second container would just repeat them against its own database.
        if: matrix.containers == 1
        run: pnpm exec vitest run --config vitest.integration.config.ts
        env:
          ALLOW_DEV_AUTH_BYPASS: "true"
          NODE_ENV: test

      - name: Run Smoke Test
        if: matrix.containers == 1
        run: pnpm exec vitest run --config vitest.smoke.config.ts
        env:
          ALLOW_DEV_AUTH_BYPASS: "true"
          NODE_ENV: test
          ENCRYPTION_KEY: "01234567890123456789012345678901"
          SESSION_SECRET: "dummy_session_secret_for_ci"

      - name: Start server
        run: NODE_ENV=test node dist/index.js &
        env:
          # Fork PRs have no secrets; the suite must still boot the server.
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'dummy_session_secret_for_ci' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          PORT: 5000
          ENCRYPTION_KEY: "01234567890123456789012345678901"
          ALLOW_DEV_AUTH_BYPASS: "true"

      - name: Wait for server
        # Replaces `npx wait-on`, which resolved an unpinned package from the
        # registry on every run. wait-on is not a dependency here, so there was
        # no local copy for `pnpm exec` to reach — hence a script rather than a
        # swapped command. It uses node's built-in fetch and adds no dependency.
        run: node script/wait-for-health.js
        env:
          PORT: 5000

      - name: Cypress run
        uses: cypress-io/github-action@09090944bd8aaa2a517cefb6e38bf1aae336b42b # v7.4.3
        with:
          record: ${{ needs.plan.outputs.record == 'true' }}
          parallel: ${{ needs.plan.outputs.record == 'true' }}
          install: false
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          PORT: 5000
