name: Cypress Tests

on: [push]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-cypress-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            cypress-${{ runner.os }}-cypress-

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        # --ignore-scripts keeps dependency lifecycle scripts from executing in
        # CI. That also skips this repo's own postinstall
        # (script/patch-cypress-deps.js), which needs the Cypress binary on disk
        # to do anything — so it runs explicitly after `cypress install` below.
        # `pnpm exec` runs the cypress pinned in the lockfile; `npx` would fall
        # back to fetching an unpinned one from the registry.
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec cypress install
          node script/patch-cypress-deps.js

      - name: Cache Cypress binary
        id: cypress-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Cypress binary
        if: steps.cypress-cache.outputs.cache-hit != 'true'
        run: pnpm exec cypress install && node script/patch-cypress-deps.js

      - name: Build application
        run: pnpm run build

      - name: Verify client bundle invariants
        # script/build.ts runs these same checks but only WARNS, so a regression
        # would scroll past in the build log. This step is the one that can
        # actually fail the run: recharts must stay off the eager critical path
        # (~390KB on every first paint if it returns) and the drizzle graph must
        # not reach the browser.
        run: pnpm check:bundle

      - name: Enable pgvector extension
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run Integration Tests
        run: |
          export ALLOW_DEV_AUTH_BYPASS="true"
          export NODE_ENV="test"
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/postgres"
          pnpm exec drizzle-kit push
          pnpm exec vitest run --config vitest.integration.config.ts

      - name: Push database schema
        run: pnpm exec drizzle-kit push

      - name: Run Smoke Test
        run: pnpm exec vitest run --config vitest.smoke.config.ts
        env:
          ALLOW_DEV_AUTH_BYPASS: "true"
          NODE_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}
          ENCRYPTION_KEY: "01234567890123456789012345678901"
          SESSION_SECRET: "dummy_session_secret_for_ci"

      - name: Start server
        run: NODE_ENV=test node dist/index.js &
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          PORT: 5000
          ENCRYPTION_KEY: "01234567890123456789012345678901"
          ALLOW_DEV_AUTH_BYPASS: "true"

      - name: Wait for server
        # Replaces `npx wait-on`, which resolved an unpinned package from the
        # registry on every run. wait-on is not a dependency here, so there was
        # no local copy for `pnpm exec` to reach — hence a script rather than a
        # swapped command. It uses node's built-in fetch and adds no dependency.
        run: node script/wait-for-health.js
        env:
          PORT: 5000

      - name: Cypress run
        uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
        with:
          record: ${{ secrets.CYPRESS_RECORD_KEY != '' }}
          parallel: ${{ secrets.CYPRESS_RECORD_KEY != '' }}
          install: false
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          PORT: 5000
