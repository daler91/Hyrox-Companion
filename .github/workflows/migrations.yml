name: Check Migrations
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Install dependencies
        # --ignore-scripts keeps dependency lifecycle scripts from executing in
        # CI. It also skips this repo's own postinstall, which only patches the
        # vendored deps inside the Cypress binary — nothing this job touches.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Migrations Internal Consistency
        run: pnpm run db:check
        env:
          DATABASE_URL: postgres://dummy:dummy@localhost:5432/dummy

      - name: Verify Migrations Are Up To Date
        run: |
          pnpm run db:generate
          git diff --exit-code migrations/
        env:
          DATABASE_URL: postgres://dummy:dummy@localhost:5432/dummy

  # Applies the REAL migration SQL to a fresh database. The other job only
  # checks journal consistency and drift, and cypress.yml provisions its DB
  # with `drizzle-kit push` — so before this job existed, a migration that
  # errors at apply time (e.g. 0035's ambiguous column reference, which broke
  # every fresh-database bootstrap) was structurally invisible to CI.
  fresh-db-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          # Passwordless trust auth: this is an ephemeral, job-scoped service
          # container that exists only for the duration of the CI run. Keeping
          # the connection URL credential-free also keeps secret scanners from
          # flagging a password-in-URI pattern.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 9.12.0

      - name: Install dependencies
        # --ignore-scripts keeps dependency lifecycle scripts from executing in
        # CI. It also skips this repo's own postinstall, which only patches the
        # vendored deps inside the Cypress binary — nothing this job touches.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply full migration chain to a fresh database
        run: pnpm run db:migrate

      - name: Re-run migrations (must be an idempotent no-op)
        run: pnpm run db:migrate

      - name: Verify journal count and critical tables
        run: |
          EXPECTED=$(node -e "console.log(require('./migrations/meta/_journal.json').entries.length)")
          APPLIED=$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM drizzle.__drizzle_migrations' 2>/dev/null \
            || psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM public.__drizzle_migrations')
          echo "journal entries: $EXPECTED, applied: $APPLIED"
          [ "$APPLIED" = "$EXPECTED" ] || { echo "::error::applied migration count ($APPLIED) != journal entries ($EXPECTED)"; exit 1; }
          for t in users workout_logs plan_days foods analytics_results user_training_style maf_profile maf_test_results maf_workout_analysis; do
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "SELECT 1 FROM \"$t\" LIMIT 0" > /dev/null
          done
