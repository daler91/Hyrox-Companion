name: Post-Migration Verification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify Railway + Neon Migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts keeps dependency lifecycle scripts from executing in
        # CI. It also skips this repo's own postinstall, which only patches the
        # vendored deps inside the Cypress binary — nothing this job touches.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply migrations to Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ENCRYPTION_KEY: "01234567890123456789012345678901"
        run: pnpm run db:migrate

      - name: Run post-migration tests against Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ENCRYPTION_KEY: "01234567890123456789012345678901"
        run: pnpm vitest run --config vitest.integration.config.ts server/routes/tests/post-migration.integration.test.ts
