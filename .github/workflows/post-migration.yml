name: Post-Migration Verification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify Railway + Neon Migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ENCRYPTION_KEY: "01234567890123456789012345678901"
        run: pnpm run db:migrate

      - name: Run post-migration tests against Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ENCRYPTION_KEY: "01234567890123456789012345678901"
        run: pnpm vitest run --config vitest.integration.config.ts server/routes/tests/post-migration.integration.test.ts
