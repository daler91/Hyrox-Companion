# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '23 1 * * 6'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Create trusted NuGet config
        run: |
          cat > "$RUNNER_TEMP/nuget.trusted.config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

      - name: Install DevSkim CLI
        run: dotnet tool install --global Microsoft.CST.DevSkim.CLI --version 1.0.70 --configfile "$RUNNER_TEMP/nuget.trusted.config"

      - name: Run DevSkim scanner
        # pnpm-lock.yaml is excluded: its base64 integrity hashes randomly
        # contain substrings like "Md2" that trip DevSkim's banned-hash-
        # algorithm rule (DS126858). Supply-chain checks on the lockfile are
        # covered by dependency-review, Socket, and Debricked instead.
        run: |
          "$HOME/.dotnet/tools/devskim" analyze \
            --source-code "$GITHUB_WORKSPACE" \
            --output-file "$GITHUB_WORKSPACE/devskim-results.sarif" \
            --ignore-globs "**/.git/**,**/bin/**,**/pnpm-lock.yaml"

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: devskim-results.sarif
