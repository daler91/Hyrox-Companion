# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '23 1 * * 6'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Create trusted NuGet config
        run: |
          cat > "$RUNNER_TEMP/nuget.trusted.config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

      - name: Install DevSkim CLI
        run: dotnet tool install --global Microsoft.CST.DevSkim.CLI --version 1.0.70 --configfile "$RUNNER_TEMP/nuget.trusted.config"

      - name: Run DevSkim scanner
        # pnpm-lock.yaml is excluded: its base64 integrity hashes randomly
        # contain substrings like "Md2" that trip DevSkim's banned-hash-
        # algorithm rule (DS126858). Supply-chain checks on the lockfile are
        # covered by dependency-review, Socket, and Debricked instead.
        # mobile/core's test resources are excluded too: they are generated
        # JSON test data (golden fixtures and API samples) holding inputs such
        # as the exercise name "HACK SQUAT", which DevSkim's TODO/HACK rule
        # (DS176209) reads as a code marker. They are written by
        # `pnpm mobile:fixtures` / `pnpm mobile:models` and hold no code.
        run: |
          "$HOME/.dotnet/tools/devskim" analyze \
            --source-code "$GITHUB_WORKSPACE" \
            --output-file "$GITHUB_WORKSPACE/devskim-results.sarif" \
            --ignore-globs "**/.git/**,**/bin/**,**/pnpm-lock.yaml,**/mobile/core/src/commonTest/resources/**"

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: devskim-results.sarif
