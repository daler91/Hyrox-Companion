name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        # --ignore-scripts keeps dependency lifecycle scripts from executing in
        # CI. It also skips this repo's own postinstall, which only patches the
        # vendored deps inside the Cypress binary — nothing this job touches.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          CLERK_PUBLISHABLE_KEY: dummy
          CLERK_SECRET_KEY: dummy
          DATABASE_URL: postgres://dummy:dummy@localhost:5432/dummy
          ENCRYPTION_KEY: "01234567890123456789012345678901"
