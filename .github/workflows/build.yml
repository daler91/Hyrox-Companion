name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm eslint .
      - name: TypeScript
        run: pnpm tsc --noEmit
      - name: TypeScript (noUncheckedIndexedAccess ratchet)
        # Locks in noUncheckedIndexedAccess for the isomorphic shared/ layer.
        # Expand tsconfig.strict.json's include (server → client → script) as
        # each directory is cleaned up; see CONTRIBUTING.md.
        run: pnpm check:strict
      - name: OpenAPI snapshot is up-to-date
        run: |
          pnpm docs:openapi
          git diff --exit-code docs/openapi.json || {
            echo "::error file=docs/openapi.json::docs/openapi.json is stale. Run 'pnpm docs:openapi' locally and commit the result." >&2
            exit 1
          }

