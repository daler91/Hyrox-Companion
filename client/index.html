<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>fitai.coach — AI-Powered Fitness Coaching</title>
    <meta name="description" content="Plan, log, and analyze your training with AI-powered coaching. Track running, strength, functional exercises, and conditioning — for any fitness goal." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="fitai.coach — Train Smarter with AI" />

         one; the *-web-app-capable metas launch the home-screen shortcut
         without browser chrome, and black-translucent lets the app draw
         under the status bar (headers pad by env(safe-area-inset-top)). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="fitai" />
  </head>
