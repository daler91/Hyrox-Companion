sonar.projectKey=daler91_Hyrox-Companion
sonar.organization=daler91

# Read only by a CI-based scan (the commented-out job in .github/workflows/build.yml).
# SonarQube Cloud Automatic Analysis, which this project uses, reads
# .sonarcloud.properties instead. The two must classify files the same way, so
# a switch to the CI scanner does not change what counts as test code;
# test/build/sonarConfig.test.ts keeps them in step (tech debt #67).
sonar.sources=client/src,server,shared,mobile
sonar.exclusions=migrations/**,**/*.sql,**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/test/support/**,mobile/**/generated/**,mobile/**/src/*Test/**
# Global exclusions apply to PR analysis too, which scans changed files
# regardless of the `sonar.sources` setting. Without this, Drizzle-generated
# SQL migrations get picked up by the PL/SQL analyzer and flagged with
# Oracle-specific rules like "Use VARCHAR2 instead of VARCHAR" that don't
# apply to PostgreSQL.
sonar.global.exclusions=migrations/**,**/*.sql
# Sources and tests share directories, so test files are excluded from the
# sources above and claimed here; a file may not be indexed as both.
sonar.tests=client/src,server,shared,mobile
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/test/support/**,mobile/**/src/*Test/**

# Only a CI-based scan can import coverage. Under Automatic Analysis the PR
# comment's "Coverage on New Code" is not a measurement; CI's coverage gate is
# the vitest thresholds that `pnpm test:coverage` enforces (tech debt #65).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
sonar.plsql.file.suffixes=.pls

# Mirrors .sonarcloud.properties: exercise-key data tables read as duplicates
# because copy-paste detection treats every string literal as the same token.
sonar.cpd.exclusions=server/prompts/exerciseSelection.ts,server/services/ai/exerciseKnowledge.ts,client/src/pages/landing/landingCopy.ts
